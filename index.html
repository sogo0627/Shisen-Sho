<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>どうぶつ二角取り</title>
<style>
:root{--bg:#fff3e6;--bg2:#ffe3ec;--ink:#6b3f4f;--tile:#fffaf0;--edge:#eccaa5;--side:#d9a97a;--sel:#ff6f9c;--btn:#ff9bb8;--line:#ff5c8a}
@media (prefers-color-scheme:dark){:root{--bg:#2a1f27;--bg2:#3a2833;--ink:#ffdfe9;--btn:#c4577d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg));color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px;font-weight:700}
h1{font-size:16px;margin:0}
#info{font-size:13px}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
#board{position:relative}
.t{position:absolute;background:var(--tile);border:2px solid var(--edge);border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--side);cursor:pointer;transition:transform .12s,opacity .25s}
.t.sel{outline:3px solid var(--sel);transform:translateY(-2px) scale(1.08);z-index:5}
.t.gone{opacity:0;transform:scale(1.5) rotate(10deg);pointer-events:none}
.t.hint{animation:bn .5s 3}
.t.shake{animation:sk .25s}
@keyframes bn{50%{transform:translateY(-5px) scale(1.1);outline:3px solid #ffd54a}}
@keyframes sk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
svg{position:absolute;inset:0;pointer-events:none;z-index:9}
svg polyline{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
nav{display:flex;gap:8px;padding:8px 10px 14px}
button{background:var(--btn);color:#fff;border:0;border-radius:999px;padding:10px 16px;font:700 14px inherit;font-family:inherit;box-shadow:0 3px 0 rgba(0,0,0,.18)}
button:active{transform:translateY(2px);box-shadow:none}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:99}
#box{background:#fffaf0;color:#6b3f4f;border-radius:22px;padding:26px 30px;text-align:center;font-weight:700;font-size:18px;line-height:1.8}
#toast{position:fixed;top:56px;background:var(--btn);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;z-index:50}
</style>
</head>
<body>
<header><h1>🐱 どうぶつ二角取り</h1><div id="info"></div></header>
<div id="wrap"><div id="board"></div></div>
<nav><button id="bH">💡ヒント</button><button id="bS">🔀混ぜる</button><button id="bN">✨新規</button></nav>
<div id="toast"></div>
<div id="msg"><div id="box"><div>🎉 クリア！ 🎉</div><button id="bR" style="margin-top:10px">もう一度あそぶ</button></div></div>
<script>
const R=12,C=11,H=R+2,W=C+2;
const K=["🐱","🐶","🐰","🐻","🐼","🐸","🐥","🦊","🐷","🐮","🐹","🐯","🐨","🐵","🐔","🐧","🐙","🦁","🐭","🦄","🐴","🐺","🐘","🦒","🐢","🐬","🐳","🦉","🐝","🦋","🐠","🦔","🐑"];
const D=[[-1,0],[1,0],[0,-1],[0,1]];
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
let g,els,sel,busy,left,s=40;

// 曲がり角2回以内で a と b をつなぐ経路を返す（盤外の周回路も使用可）。無ければ null
function find(h,a,b){
  function walk(r,c,d,t,pts){
    let nr=r,nc=c;
    for(;;){
      nr+=D[d][0];nc+=D[d][1];
      if(nr<0||nc<0||nr>=H||nc>=W)return null;
      if(nr===b[0]&&nc===b[1])return pts.concat([[nr,nc]]);
      if(h[nr][nc]!==-1)return null;
      if(t<2){
        for(const e of(d<2?[2,3]:[0,1])){
          const res=walk(nr,nc,e,t+1,pts.concat([[nr,nc]]));
          if(res)return res;
        }
      }
    }
  }
  for(let d=0;d<4;d++){const p=walk(a[0],a[1],d,0,[a]);if(p)return p}
  return null;
}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

// 逆順構築：つなげられる2枚を選んで取り除きつつ絵柄を割り当てる → 必ず全消しできる
function gen(cells,pool){
  for(let n=0;n<200;n++){
    const h=Array.from({length:H},()=>Array(W).fill(-1));
    cells.forEach(([r,c])=>h[r][c]=0);
    const live=cells.slice(),p=shuf(pool.slice()),res={};let ok=true;
    while(live.length){
      shuf(live);let found=false;
      for(let i=0;i<live.length&&!found;i++){
        for(let j=i+1;j<live.length;j++){
          if(find(h,live[i],live[j])){
            const k=p.pop(),a=live[i],b=live[j];
            res[a[0]*100+a[1]]=k;res[b[0]*100+b[1]]=k;
            h[a[0]][a[1]]=-1;h[b[0]][b[1]]=-1;
            live.splice(j,1);live.splice(i,1);found=true;break;
          }
        }
      }
      if(!found){ok=false;break}
    }
    if(ok)return res;
  }
  return null;
}
function newGame(){
  const cells=[];for(let r=1;r<=R;r++)for(let c=1;c<=C;c++)cells.push([r,c]);
  const pool=[];for(let k=0;k<K.length;k++){pool.push(k,k)}
  const res=gen(cells,pool);
  g=Array.from({length:H},()=>Array(W).fill(-1));
  cells.forEach(([r,c])=>g[r][c]=res[r*100+c]);
  left=cells.length/2;sel=null;busy=false;$("msg").style.display="none";build();
}
function build(){
  const b=$("board");b.innerHTML="";els={};
  for(let r=1;r<=R;r++)for(let c=1;c<=C;c++){
    const d=document.createElement("div");d.className="t";
    d.textContent=K[g[r][c]];d.style.background="hsl("+(g[r][c]*11)+",85%,93%)";
    d.onclick=()=>tap(r,c);b.appendChild(d);els[r*100+c]=d;
  }
  const sv=document.createElementNS("http://www.w3.org/2000/svg","svg");sv.id="sv";b.appendChild(sv);
  layout();info();
}
function layout(){
  s=Math.floor(Math.min((innerWidth-16)/(C+.8),(innerHeight-170)/(R+.8),52));
  const b=$("board");b.style.width=(C+.8)*s+"px";b.style.height=(R+.8)*s+"px";
  for(const k in els){const r=Math.floor(k/100),c=k%100,d=els[k];
    d.style.width=s-4+"px";d.style.height=s-4+"px";
    d.style.left=(.4+c-1)*s+2+"px";d.style.top=(.4+r-1)*s+2+"px";d.style.fontSize=s*.6+"px";}
}
const px=(i,n)=>i===0?.2*s:i===n+1?(n+.6)*s:(.4+i-.5)*s;
function info(){$("info").textContent="のこり "+left+" ペア"}
function tap(r,c){
  if(busy||g[r][c]===-1)return;
  const e=els[r*100+c];
  if(!sel){sel=[r,c];e.classList.add("sel");return}
  const [sr,sc]=sel,se=els[sr*100+sc];
  if(sr===r&&sc===c){sel=null;e.classList.remove("sel");return}
  if(g[sr][sc]===g[r][c]){
    const p=find(g,[sr,sc],[r,c]);
    if(p){remove(p,[sr,sc],[r,c]);return}
  }
  se.classList.remove("sel");e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake");
  sel=[r,c];e.classList.add("sel");
}
function remove(p,a,b){
  busy=true;
  const pts=p.map(([r,c])=>px(c,C)+","+px(r,R)).join(" ");
  $("sv").innerHTML='<polyline points="'+pts+'"/>';
  setTimeout(()=>{
    $("sv").innerHTML="";
    for(const [r,c] of [a,b]){g[r][c]=-1;const e=els[r*100+c];e.classList.remove("sel");e.classList.add("gone")}
    sel=null;left--;info();busy=false;
    if(!left){$("msg").style.display="flex";return}
    if(!hint(true)){toast("手詰まり！自動で混ぜたよ🔀");shuffle(true)}
  },320);
}
function hint(check){
  const cells=[];
  for(let r=1;r<=R;r++)for(let c=1;c<=C;c++)if(g[r][c]!==-1)cells.push([r,c]);
  shuf(cells);
  for(let i=0;i<cells.length;i++)for(let j=i+1;j<cells.length;j++){
    const a=cells[i],b=cells[j];
    if(g[a[0]][a[1]]===g[b[0]][b[1]]&&find(g,a,b)){
      if(!check)[a,b].forEach(([r,c])=>{const e=els[r*100+c];e.classList.remove("hint");void e.offsetWidth;e.classList.add("hint")});
      return true;
    }
  }
  return false;
}
function shuffle(auto){
  if(busy)return;
  const cells=[],cnt={};
  for(let r=1;r<=R;r++)for(let c=1;c<=C;c++)if(g[r][c]!==-1){cells.push([r,c]);cnt[g[r][c]]=(cnt[g[r][c]]||0)+1}
  const pool=[];for(const k in cnt)for(let n=0;n<cnt[k]/2;n++)pool.push(+k);
  const res=gen(cells,pool);if(!res)return;
  if(sel){els[sel[0]*100+sel[1]].classList.remove("sel");sel=null}
  cells.forEach(([r,c])=>{const k=res[r*100+c];g[r][c]=k;const e=els[r*100+c];e.textContent=K[k];e.style.background="hsl("+(k*11)+",85%,93%)"});
  if(!auto)toast("混ぜました🔀");
}
function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1800)}
$("bH").onclick=()=>{if(!busy)hint(false)};
$("bS").onclick=()=>shuffle(false);
$("bN").onclick=newGame;$("bR").onclick=newGame;
addEventListener("resize",layout);
newGame();
</script>
</body>
</html>
